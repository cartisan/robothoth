default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: uv run --locked ruff check src tests
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy
        entry: uv run --locked mypy src tests
        language: system
        pass_filenames: false
        always_run: true
